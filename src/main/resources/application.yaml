spring:
  application:
    name: localbuddy-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:6MB}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: LocalBuddyHikariPool
      # Env-overridable: workload is I/O-bound on a remote Postgres, so a few more
      # connections raises concurrency during query waits. Dial down via DB_POOL_MAX
      # if the Supabase pooler caps below this.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 300000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Batch lazy to-one/collection initialisations into IN (...) loads. Kills the
        # N+1 in DTO mapping (experience catalog/search -> toResponse touches city,
        # category, categories, localProfile per row) without fetch-join rewrites.
        default_batch_fetch_size: 100
        in_clause_parameter_padding: true
        # Batch JDBC writes (saveAll in schedulers, bulk notification inserts).
        order_inserts: true
        order_updates: true
        jdbc:
          time_zone: UTC
          batch_size: 30

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

  health:
    redis:
      enabled: false

logging:
  level:
    root: INFO
    # Default INFO in every environment; set LOG_LEVEL_APP=DEBUG when actively
    # debugging. DEBUG on the hot path is real CPU/IO cost on a 1-vCPU B1 box.
    # Exceptions/stack traces still log at WARN/ERROR regardless of this.
    com.localbuddy: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
      refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
    reset-token-expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:30}
    verification-token-expiration-hours: ${VERIFICATION_TOKEN_EXPIRATION_HOURS:48}

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  platform:
    default-city: Amsterdam
    commission-percentage: 20          # fallback when no PLATFORM commission_rule row exists
    max-commission-rate: ${MAX_COMMISSION_RATE:0.50}   # hard cap (fraction) admins can assign; guards against negative host payouts

  fees:
    service-fee-percentage: ${SERVICE_FEE_PERCENTAGE:2.5}

  referral:
    # Fallback reward/discount (same amount for the referred user's discount and the
    # referrer's reward) used whenever no active admin config window applies.
    default-reward-amount: ${REFERRAL_DEFAULT_REWARD_AMOUNT:20}
    reward-currency: ${REFERRAL_REWARD_CURRENCY:EUR}
    # Default per-referrer cap on redemptions within a calendar month.
    default-max-monthly-redemptions: ${REFERRAL_MAX_MONTHLY_REDEMPTIONS:5}
    # Validity of the personal promo voucher minted for the referrer on completion.
    reward-voucher-expiry-days: ${REFERRAL_REWARD_VOUCHER_EXPIRY_DAYS:90}
    # How often the scheduled processor settles eligible/cancelled referral rewards.
    processor-delay-ms: ${REFERRAL_PROCESSOR_DELAY_MS:300000}

  pricing:
    age-band:
      adult-rate: ${AGE_BAND_ADULT_RATE:1.0}     # adults pay full price
      teen-rate: ${AGE_BAND_TEEN_RATE:1.0}        # teens full price; band exists to age-gate 18+ experiences
      child-rate: ${AGE_BAND_CHILD_RATE:0.5}      # children half price
      infant-rate: ${AGE_BAND_INFANT_RATE:0.0}    # infants free

  vat:
    default-country: ${VAT_DEFAULT_COUNTRY:NL}
    standard-rate-percentage: ${VAT_STANDARD_RATE_PERCENTAGE:21}
    merchant-of-record: ${VAT_MERCHANT_OF_RECORD:INTERMEDIARY}   # INTERMEDIARY | DEEMED_SUPPLIER

  payout:
    schedule: ${PAYOUT_SCHEDULE:MONTHLY}             # WEEKLY | BIWEEKLY | MONTHLY
    hold-hours: ${PAYOUT_HOLD_HOURS:72}
    minimum-amount: ${PAYOUT_MINIMUM_AMOUNT:25}
    day-of-month: ${PAYOUT_DAY_OF_MONTH:1}
    processor-delay-ms: ${PAYOUT_PROCESSOR_DELAY_MS:3600000}

  notifications:
    processor-delay-ms: 10000
    reminder-processor-delay-ms: ${NOTIFICATION_REMINDER_PROCESSOR_DELAY_MS:900000}
    reminder-lead-hours: ${NOTIFICATION_REMINDER_LEAD_HOURS:24}

  reminders:
    # Comma-separated hours after which wishlist / abandoned-booking reminders fire (each fires once).
    offsets-hours: ${REMINDER_OFFSETS_HOURS:2,24,48}
    # Stop nudging items/bookings older than this many hours.
    max-age-hours: ${REMINDER_MAX_AGE_HOURS:72}
    processor-delay-ms: ${REMINDER_PROCESSOR_DELAY_MS:1800000}

  payments:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/payment/success}
      cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/payment/cancel}
  booking:
    pending-payment-expiration-minutes: ${BOOKING_PENDING_PAYMENT_EXPIRATION_MINUTES:15}
    expiry-processor-delay-ms: ${BOOKING_EXPIRY_PROCESSOR_DELAY_MS:60000}
    minimum-guests-to-confirm: ${BOOKING_MINIMUM_GUESTS_TO_CONFIRM:3}
    underbooked-notice-hours: ${BOOKING_UNDERBOOKED_NOTICE_HOURS:36}
    underbooked-cancel-deadline-hours: ${BOOKING_UNDERBOOKED_CANCEL_DEADLINE_HOURS:24}
    underbooked-processor-delay-ms: ${BOOKING_UNDERBOOKED_PROCESSOR_DELAY_MS:300000}
    auto-complete-after-hours: ${BOOKING_AUTO_COMPLETE_AFTER_HOURS:48}
    auto-complete-processor-delay-ms: ${BOOKING_AUTO_COMPLETE_PROCESSOR_DELAY_MS:300000}

  checkin:
    # How early before the slot start a check-in is allowed (minutes).
    before-minutes: ${CHECKIN_BEFORE_MINUTES:15}
    # How late after the slot start a check-in is still allowed (minutes).
    after-minutes: ${CHECKIN_AFTER_MINUTES:15}
    # Geofence radius from the experience meeting point (metres).
    geofence-radius-meters: ${CHECKIN_GEOFENCE_RADIUS_METERS:300}
    # Worst device accuracy we still trust; beyond this a guest check-in is rejected (metres).
    max-accuracy-meters: ${CHECKIN_MAX_ACCURACY_METERS:500}
    # Delete check-in rows older than this (days); operational data, not refund proof.
    retention-days: ${CHECKIN_RETENTION_DAYS:90}
    retention-processor-delay-ms: ${CHECKIN_RETENTION_PROCESSOR_DELAY_MS:86400000}

  email:
    provider: ${EMAIL_PROVIDER:console}
    from-address: ${EMAIL_FROM_ADDRESS:no-reply@localbuddy.dev}
    from-name: ${EMAIL_FROM_NAME:LocalBuddy}

  azure:
    communication:
      connection-string: ${AZURE_COMMUNICATION_CONNECTION_STRING:}

  media:
    azure:
      connection-string: ${AZURE_BLOB_CONNECTION_STRING:}
      container: ${AZURE_BLOB_CONTAINER:experience-photos}
      public-base-url: ${AZURE_BLOB_PUBLIC_BASE_URL:}

  whatsapp:
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}

  wallet:
    google:
      issuer-id: ${GOOGLE_WALLET_ISSUER_ID:}
      class-id: ${GOOGLE_WALLET_CLASS_ID:}
      service-account-email: ${GOOGLE_WALLET_SA_EMAIL:}
      service-account-private-key: ${GOOGLE_WALLET_SA_PRIVATE_KEY:}
      origin: ${GOOGLE_WALLET_ORIGIN:}
    apple:
      pass-type-id: ${APPLE_WALLET_PASS_TYPE_ID:}
      team-id: ${APPLE_WALLET_TEAM_ID:}
      organization-name: ${APPLE_WALLET_ORG_NAME:LocalBuddy}
      certificate-base64: ${APPLE_WALLET_CERT_BASE64:}
      certificate-password: ${APPLE_WALLET_CERT_PASSWORD:}
      wwdr-base64: ${APPLE_WALLET_WWDR_BASE64:}

  dev-admin:
    email: ${DEV_ADMIN_EMAIL:admin@test.com}
    password: ${DEV_ADMIN_PASSWORD:Password@123}
    full-name: ${DEV_ADMIN_FULL_NAME:Test Admin}
    phone: ${DEV_ADMIN_PHONE:+10000000000}

  support:
    email: ${SUPPORT_EMAIL:admin@test.com}

  rate-limit:
    public-api:
      enabled: ${PUBLIC_API_RATE_LIMIT_ENABLED:true}
      max-requests: ${PUBLIC_API_RATE_LIMIT_MAX_REQUESTS:20}
      window-seconds: ${PUBLIC_API_RATE_LIMIT_WINDOW_SECONDS:60}

  social:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    facebook:
      # App ID is public; App Secret is server-only. Both required in prod so the
      # token's app_id can be verified (blocks token-swap login). Blank in dev =
      # that audience check is skipped, same off-until-configured pattern as above.
      app-id: ${FACEBOOK_APP_ID:}
      app-secret: ${FACEBOOK_APP_SECRET:}

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1/messages}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}

  incident:
    # In-process incident monitor: probes the DB and, on sustained failure, opens an incident,
    # emails operators (bypassing the DB-backed notification queue), and flips the public banner.
    enabled: ${INCIDENT_MONITOR_ENABLED:true}
    check-interval-ms: ${INCIDENT_CHECK_INTERVAL_MS:30000}
    failure-threshold: ${INCIDENT_FAILURE_THRESHOLD:2}      # consecutive fails before declaring an incident
    recovery-threshold: ${INCIDENT_RECOVERY_THRESHOLD:2}    # consecutive successes before auto-resolving
    probe-timeout-ms: ${INCIDENT_PROBE_TIMEOUT_MS:5000}
    reminder-interval-ms: ${INCIDENT_REMINDER_INTERVAL_MS:0}  # 0 = one email on open + one on resolve, no reminders
    # Operator recipients (comma-separated). Falls back to app.support.email when blank.
    alert-emails: ${INCIDENT_ALERT_EMAILS:}
    banner-message: ${INCIDENT_BANNER_MESSAGE:We're experiencing some technical difficulties and are working to restore full service. Some features may be temporarily unavailable — please try again shortly.}
